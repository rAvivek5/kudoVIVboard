<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hypewall — say the nice thing out loud</title>
    <meta name="description" content="Internal appreciation boards for birthdays, farewells, promotions and every excuse in between." />
    <meta name="theme-color" content="#F1EFFF" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Light unless this browser explicitly chose dark. prefers-color-scheme is
      // ignored on purpose: a shared board should look the same for everybody
      // who opens the link.
      (function () {
        try {
          document.documentElement.classList.toggle(
            'dark',
            localStorage.getItem('hw:theme') === 'dark'
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
